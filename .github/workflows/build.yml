name: Build Extension

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - ".prettierignore"
      - ".prettierrc"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.*"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - ".prettierignore"
      - ".prettierrc"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.*"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    if: |
      !contains(github.event.head_commit.message || '', '[skip build]')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Prepare signing key
        id: signing-key
        if: github.event_name != 'pull_request'
        env:
          EDGE_DL_PEM: ${{ secrets.EdgeDL_PEM }}
        run: |
          if [ -z "$EDGE_DL_PEM" ]; then
            echo "EDGE_DL_PEM secret is not set; skipping package artifacts."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p dist
          printf '%s\n' "$EDGE_DL_PEM" > dist/EdgeDL-Ext.pem
          chmod 600 dist/EdgeDL-Ext.pem
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Package extension
        if: steps.signing-key.outputs.available == 'true'
        run: npm run pack

      - name: Upload zip artifact
        if: steps.signing-key.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EdgeDL-Ext-zip
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload crx artifact
        if: steps.signing-key.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EdgeDL-Ext-crx
          path: dist/*.crx
          archive: false
          if-no-files-found: error
          retention-days: 7
